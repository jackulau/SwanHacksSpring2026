<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="logo">H</div>
      <h1>HackStack</h1>
    </div>

    <div id="login-view" class="view">
      <p class="subtitle">Sign in to sync Canvas data</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="login-btn">Sign In</button>
      </form>
      <p id="login-error" class="error"></p>
      <details class="settings-details">
        <summary>Server Settings</summary>
        <input type="url" id="pb-url" placeholder="http://127.0.0.1:8090">
        <button id="save-url" class="btn-secondary">Save</button>
      </details>
    </div>

    <div id="connected-view" class="view hidden">
      <div class="user-row">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <p id="user-name" class="user-name"></p>
          <p id="user-email" class="user-email"></p>
        </div>
      </div>
      <div class="status-card" id="sync-status">
        <p class="status-label">Last sync</p>
        <p id="last-sync" class="status-value">Never</p>
      </div>
      <p class="hint">Navigate to Canvas and click "Sync to HackStack" button</p>
      <button id="inject-btn" class="btn-inject">Inject Sync Button on This Tab</button>
      <button id="logout-btn" class="btn-logout">Sign Out</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
