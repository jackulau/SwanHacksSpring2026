<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <div class="header">
      <div class="logo">C</div>
      <h1>Converge</h1>
    </div>

    <div id="login-view" class="view">
      <p class="subtitle">Sign in to sync Canvas data</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit" id="login-btn">Sign In</button>
      </form>
      <p id="login-error" class="error"></p>
      <details class="settings-details">
        <summary>Server Settings</summary>
        <input type="url" id="pb-url" placeholder="http://127.0.0.1:8090">
        <button id="save-url" class="btn-secondary">Save</button>
      </details>
    </div>

    <div id="connected-view" class="view hidden">
      <div class="user-row">
        <div class="avatar" id="user-avatar">?</div>
        <div class="user-info">
          <p id="user-name" class="user-name"></p>
          <p id="user-email" class="user-email"></p>
        </div>
      </div>
      <div class="status-card" id="sync-status">
        <p class="status-label">Last sync</p>
        <p id="last-sync" class="status-value">Never</p>
      </div>

      <div id="progress-container" class="progress-container hidden">
        <div class="progress-bar-track">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
        <p id="progress-text" class="progress-text">Preparing...</p>
      </div>

      <button id="sync-btn" class="btn-sync">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
          <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
          <path d="M16 16h5v5"/>
        </svg>
        Sync Canvas
      </button>
      <button id="logout-btn" class="btn-logout">Sign Out</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
